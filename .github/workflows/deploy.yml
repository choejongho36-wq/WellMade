name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC로 AWS 역할 assume

env:
  AWS_REGION: ap-northeast-2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # application.yml 은 gitignore라 CI 체크아웃에 없음 → 컨텍스트 로딩 테스트는 불가.
      # 컴파일 + 패키징만 검증한다 (서버 Dockerfile도 -x test).
      - run: cd backend && chmod +x gradlew && ./gradlew bootJar -x test

 
