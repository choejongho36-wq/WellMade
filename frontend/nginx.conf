# 프론트 정적 파일 서빙 + 백엔드/AI 리버스 프록시.
# 프론트와 API 가 같은 오리진(이 nginx)으로 묶이므로 브라우저 CORS 는 발생하지 않는다.
#
# /ai/ 는 인증이 없는 경로다. 실시간 자세 코칭은 브라우저가 프레임을 초당 여러 번 직접
# 보내야 해서 JWT 검증 구간을 끼우기 어렵다(또래 비교처럼 끼울 수 있는 건 백엔드
# /api/users/me/insights/... 로 옮겼다). 남은 경로는 최소한 속도 제한을 걸어 한 IP가
# 무제한으로 때리지 못하게 한다.
#
# 이 파일은 conf.d/ 로 들어가 http 컨텍스트 안에서 include 되므로 zone 선언을 여기 둘 수 있다.
# rate: 실시간 코칭이 프레임을 초당 5~10건 보내므로 그보다 넉넉하게 잡고, 순간적으로 몰리는
# 건 burst 로 흡수한다(nodelay - 큐에 세워 늦추면 코칭이 끊겨 보인다).
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=ai_conn:10m;

server {
    listen 80;
    server_name _;

    # 업스트림을 이름 그대로 proxy_pass 에 쓰면 nginx 가 기동 시 한 번만 DNS 를 해석하고
    # 그 IP 를 계속 쓴다. 그래서 backend 컨테이너만 재생성하면(IP 가 바뀜) 이 nginx 는
    # 죽은 IP 를 계속 찔러 502 가 났다. Docker 내장 DNS 를 resolver 로 걸고 업스트림을
    # 변수로 넘기면 매 요청마다 다시 해석한다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # SPA - 없는 경로는 index.html 로 (React Router 가 처리)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Spring Boot
    location /api/ {
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 챗봇 SSE 스트리밍 - 버퍼링을 끄지 않으면 토큰이 모였다가 한 번에 나옴
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Spring Security OAuth2 - 로그인 시작(/oauth2/authorization/*)과
    # 소셜 콜백(/login/oauth2/code/*)은 백엔드가 직접 처리한다.
    # 이 nginx는 항상 Caddy(HTTPS) 뒤에 있으므로 proto를 https로 고정 -
    # 안 그러면 Spring이 콜백 redirect_uri를 http로 만들어 소셜 콘솔과 불일치.
    location ~ ^/(oauth2|login/oauth2)/ {
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # FastAPI AI 서버 (엔드포인트가 /ai/... 및 /health)
    location /ai/ {
        limit_req zone=ai_limit burst=40 nodelay;
        limit_conn ai_conn 10;
        limit_req_status 429;
        limit_conn_status 429;

        set $upstream_ai http://ai:8000;
        proxy_pass $upstream_ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
