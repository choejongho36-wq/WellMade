# 프론트 정적 파일 서빙 + 백엔드/AI 리버스 프록시.
# 프론트와 API 가 같은 오리진(이 nginx)으로 묶이므로 브라우저 CORS 는 발생하지 않는다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA - 없는 경로는 index.html 로 (React Router 가 처리)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Spring Boot
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 챗봇 SSE 스트리밍 - 버퍼링을 끄지 않으면 토큰이 모였다가 한 번에 나옴
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # FastAPI AI 서버 (엔드포인트가 /ai/... 및 /health)
    location /ai/ {
        proxy_pass http://ai:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
