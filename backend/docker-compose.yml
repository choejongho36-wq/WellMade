services:
  mysql:
    image: mysql:8.0
    container_name: wellmade-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: wellmade
      MYSQL_USER: wellmade_user
      MYSQL_PASSWORD: wellmade1234
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
 
volumes:
  mysql_data: